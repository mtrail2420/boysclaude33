<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Classes — Trail & Bish Dynasty</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .topbar{position:sticky; top:0; z-index:10; background:rgba(11,13,18,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 16px;}
  .row1{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-size:13px; letter-spacing:0.14em; color:var(--muted);}
  .brand b{color:var(--text);}
  .year-tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 16px; -webkit-overflow-scrolling:touch;}
  .ytab{flex:0 0 auto; font-size:12px; font-family:"SFMono-Regular",Consolas,monospace; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); cursor:pointer;}
  .ytab.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .class-head{padding:6px 16px 12px; display:flex; align-items:baseline; justify-content:space-between;}
  .class-head .yr{font-size:32px;}
  .class-head .stat{font-size:11px; color:var(--muted); text-align:right;}
  .class-head .stat b{color:var(--text); font-family:"SFMono-Regular",Consolas,monospace;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .side{background:var(--bg); padding:10px 10px 14px;}
  .side-head{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; padding:6px 4px 10px; display:flex; align-items:center; gap:6px;}
  .side-head .dot{width:8px;height:8px;border-radius:50%;}
  .side.matt .side-head{color:var(--matt);}
  .side.ryan .side-head{color:var(--ryan);}
  .side.matt .side-head .dot{background:var(--matt);}
  .side.ryan .side-head .dot{background:var(--ryan);}
  .pick{padding:8px 4px; border-bottom:1px solid var(--surface2);}
  .pick .pname{font-size:13px; line-height:1.25;}
  .pick .pmeta{font-size:10px; color:var(--muted); margin-top:2px;}
  .pick .pscore{font-family:"SFMono-Regular",Consolas,monospace; font-size:11px; float:right; color:var(--muted);}
  .pick.legend .pscore{color:var(--legend-a);}
</style>
</head>
<body>

  <div class="topbar"><div class="row1"><div class="brand"><b>DRAFT CLASSES</b></div></div></div>
  <div class="year-tabs" id="tabs"></div>
  <div id="classHead" class="class-head"></div>
  <div id="split" class="split"></div>

<script>
let PLAYERS = [];
let currentYear = null;

function render(){
  const tabsEl = document.getElementById('tabs');
  [...tabsEl.children].forEach(t=>{
    t.classList.toggle('active', Number(t.dataset.year)===currentYear);
  });

  const classPlayers = PLAYERS.filter(p=>p.year===currentYear);
  const matt = classPlayers.filter(p=>p.owner==='Matt').sort((a,b)=>(parseFloat(b.score)||0)-(parseFloat(a.score)||0));
  const ryan = classPlayers.filter(p=>p.owner==='Ryan').sort((a,b)=>(parseFloat(b.score)||0)-(parseFloat(a.score)||0));

  const avg = arr => {
    const vals = arr.map(p=>parseFloat(p.score)).filter(v=>!isNaN(v));
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : "—";
  };

  document.getElementById('classHead').innerHTML = `
    <span class="yr display">${currentYear} Class</span>
    <span class="stat">${classPlayers.length} total picks<br><b>${avg(matt)}</b> vs <b>${avg(ryan)}</b> avg score</span>
  `;

  const sideHtml = (arr, ownerClass, ownerName) => `
    <div class="side ${ownerClass}">
      <div class="side-head"><span class="dot"></span>${ownerName} · ${arr.length} picks</div>
      ${arr.map(p=>`
        <div class="pick ${(p.tier||'').toLowerCase()}">
          <span class="pscore">${p.score}</span>
          <div class="pname">${p.name}</div>
          <div class="pmeta">${p.position} · ${p.tier}</div>
        </div>
      `).join('') || '<div class="pmeta" style="padding:8px 4px;">No picks</div>'}
    </div>
  `;
  document.getElementById('split').innerHTML = sideHtml(matt,'matt','Matt') + sideHtml(ryan,'ryan','Ryan');
}

fetch('data/players.json').then(r=>r.json()).then(data=>{
  PLAYERS = data;
  const years = [...new Set(PLAYERS.map(p=>p.year))].sort((a,b)=>b-a);
  const yearParam = new URLSearchParams(location.search).get('year');
  currentYear = (yearParam && years.includes(Number(yearParam))) ? Number(yearParam) : years[0];
  const tabsEl = document.getElementById('tabs');
  years.forEach(y=>{
    const t = document.createElement('div');
    t.className = 'ytab' + (y===currentYear ? ' active' : '');
    t.textContent = y;
    t.dataset.year = y;
    t.addEventListener('click', ()=>{ currentYear = y; render(); });
    tabsEl.appendChild(t);
  });
  render();
});
</script>
<script src="assets/nav.js" defer></script>
</body>
</html>
